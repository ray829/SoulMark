[package]
name = "soul-mark"
version = "0.1.0"
description = "Soul Mark - A Markdown editor with code highlighting, mermaid and math support"
authors = ["wangfeiting"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soul_mark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"

# 仅 Windows/Linux 需要:捕获"第二个实例唤起已运行实例"时的命令行参数。
# macOS 由系统保证单实例,文件打开事件走 RunEvent::Opened,无需此插件。
# target 限定避免 mobile 构建拉入不支持的平台 crate。
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
